name: CyberNest MDM - CI Pipeline

on:
  push:
    branches: [ "main", "master", "Ramzan" ]  # ✅ Ramzan branch added
  pull_request:
    branches: [ "main", "master", "Ramzan" ]
  workflow_dispatch: # Manual trigger ke liye

jobs:
  # ============================================
  # JOB 1: BACKEND VALIDATION
  # ============================================
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ./backend/package.json # Updated for safety
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm install # 'ci' ki jagah 'install' takay lock file mismatch na ho
      
      - name: Check package.json syntax
        working-directory: ./backend
        run: node -p "require('./package.json').name"
      
      - name: Check server.js exists
        working-directory: ./backend
        run: |
          if [ -f "server.js" ]; then
            echo "✅ server.js found"
            node -c server.js
          else
            echo "❌ server.js not found"
            exit 1
          fi
      
      - name: Validate backend structure
        working-directory: ./backend
        run: |
          echo "✅ Backend structure validated"
          ls -la

  # ============================================
  # JOB 2: FRONTEND TESTING
  # ============================================
  frontend-test:
    name: Frontend React Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ./frontend/cybernest-dashboard/package.json
      
      - name: Install dependencies
        working-directory: ./frontend/cybernest-dashboard
        run: npm install
      
      - name: Run tests (CRA)
        working-directory: ./frontend/cybernest-dashboard
        run: CI=true npm test -- --watchAll=false --passWithNoTests
      
      - name: Build frontend
        working-directory: ./frontend/cybernest-dashboard
        run: npm run build
        env:
          CI: false # Build warnings par fail na ho isliye false rakha hai
      
      - name: Verify build output
        working-directory: ./frontend/cybernest-dashboard
        run: |
          if [ -d "build" ]; then
            echo "✅ Build successful!"
          else
            echo "❌ Build failed"
            exit 1
          fi

  # ============================================
  # JOB 3: PROJECT STRUCTURE VALIDATION
  # ============================================
  structure-check:
    name: Project Structure Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify folder structure
        run: |
          echo "📁 Checking CyberNest MDM Structure..."
          [ -d "backend" ] && echo "✅ Backend folder ok" || echo "❌ Backend missing"
          [ -d "frontend/cybernest-dashboard" ] && echo "✅ Frontend folder ok" || echo "❌ Frontend missing"
          [ -f ".github/workflows/test.yml" ] && echo "✅ Workflow ok"

  # ============================================
  # JOB 4: CODE QUALITY CHECKS
  # ============================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for common issues
        run: |
          CONSOLE_COUNT=$(grep -r "console\.log" --include="*.js" --include="*.jsx" . 2>/dev/null | wc -l)
          echo "📝 Console logs found: $CONSOLE_COUNT"
          echo "✅ Quality check finished"

  # ============================================
  # JOB 5: FINAL SUMMARY
  # ============================================
  summary:
    name: 📊 Workflow Summary
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-test, structure-check, code-quality]
    if: always()
    
    steps:
      - name: Print final status
        run: |
          echo "╔════════════════════════════════════════════════╗"
          echo "║    ✅ CyberNest MDM - CI Complete ✅           ║"
          echo "╠════════════════════════════════════════════════╣"
          echo "║ Backend:        ${{ needs.backend-check.result }} "
          echo "║ Frontend:       ${{ needs.frontend-test.result }} "
          echo "║ Structure:      ${{ needs.structure-check.result }} "
          echo "║ Quality:        ${{ needs.code-quality.result }} "
          echo "╠════════════════════════════════════════════════╣"
          echo "║ Triggered by:   ${{ github.actor }}            ║"
          echo "╚════════════════════════════════════════════════╝"